<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: a bench worksheet — input column and result sheet side by side on wide screens, stacked on phones */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --ink:#14222C; --muted:#5A6B76; --line:#D5DEE3;
  --accent:#0B6C88; --accent-soft:#E2F0F4; --cal:#B4531A; --cal-soft:#F8E7DB;
  --ok:#1E7A4C; --ok-soft:#E1F2E8; --warn:#9A6400; --warn-soft:#FBF0D9; --bad:#B42318; --bad-soft:#FBE4E1;
  --bar:#9CB8C4;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --surface:#162229; --ink:#E4ECEF; --muted:#94A6B0; --line:#2A3A43;
  --accent:#5DB8D3; --accent-soft:#183540; --cal:#F0955C; --cal-soft:#3A2618;
  --ok:#5CC98F; --ok-soft:#173326; --warn:#E5B04D; --warn-soft:#352A12; --bad:#F2796C; --bad-soft:#3B1C19;
  --bar:#3E5E6C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#162229; --ink:#E4ECEF; --muted:#94A6B0; --line:#2A3A43;
  --accent:#5DB8D3; --accent-soft:#183540; --cal:#F0955C; --cal-soft:#3A2618;
  --ok:#5CC98F; --ok-soft:#173326; --warn:#E5B04D; --warn-soft:#352A12; --bad:#F2796C; --bad-soft:#3B1C19;
  --bar:#3E5E6C; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.wrap{max-width:1140px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(25px,4vw,33px);margin:0;letter-spacing:.2px;text-wrap:balance}
h1 .latin{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.lede{margin:4px 0 0;color:var(--muted);max-width:66ch}
.toprt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 8px;white-space:nowrap}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0 0 12px}
.step{display:grid;gap:6px;margin-bottom:16px}
label{font-weight:600;font-size:14px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
textarea,select,input[type=number],input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{font-family:var(--f-mono);font-size:13px;min-height:110px;resize:vertical;direction:ltr;text-align:left}
input[type=number],input[type=text]{font-family:var(--f-mono);direction:ltr;text-align:left}
textarea:focus,select:focus,input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:600;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.small{padding:5px 10px;font-size:13px}
button:disabled{opacity:.55;cursor:default}
button:hover:not(:disabled){filter:brightness(1.05)}
.file input{font-size:13px;max-width:100%}
.radio{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px}
.radio label{font-weight:400;display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;font-size:13px;background:var(--surface);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.sample{display:inline-block;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 8px;margin-bottom:10px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:560px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv{border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.kv b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.kv span{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.methodbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.limits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.limits{grid-template-columns:minmax(0,1fr)}}
.lim{border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0;display:grid;gap:8px;align-content:start}
.lim h3{margin:0;font-family:var(--f-display);font-size:15px;font-weight:600}
.est{font-family:var(--f-mono);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
[dir=rtl] .est{text-align:right}
.est small{font-size:13px;color:var(--muted);margin-inline-start:6px}
.ints{display:grid;gap:4px;font-size:13.5px}
.ints div{display:flex;justify-content:space-between;gap:8px}
.ints .v{font-family:var(--f-mono);direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.ints .cal .v{color:var(--cal);font-weight:600}
.verdict{border-radius:6px;padding:8px 10px;font-size:13.5px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.none{background:var(--accent-soft);color:var(--accent)}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:14px}
table.cmp th,table.cmp td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
table.cmp th{font-weight:600;color:var(--muted);font-size:12.5px}
table.cmp td.n{font-family:var(--f-mono);direction:ltr;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.none{background:var(--accent-soft);color:var(--accent)}
.notes{display:grid;gap:6px;margin-top:14px}
.note{font-size:13px;border-inline-start:3px solid var(--warn);background:var(--warn-soft);padding:7px 10px;border-radius:0 6px 6px 0}
[dir=ltr] .note{border-radius:6px 0 0 6px}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.err{color:var(--bad);font-weight:600}
.busy{color:var(--muted);font-size:14px}
.chartbox{margin-top:16px;overflow-x:auto}
svg text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:middle}
.exports{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
details.about{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
details.about summary{cursor:pointer;font-family:var(--f-display);font-weight:600}
.about p,.about li{max-width:76ch}
.about ol,.about ul{padding-inline-start:20px}
.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
footer{margin-top:22px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
footer .mono{word-break:break-all}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app" dir="rtl" lang="ar">
<header class="top">
  <div>
    <h1><span data-i="title"></span> <span class="latin">CalibRI</span></h1>
    <p class="lede" data-i="lede"></p>
  </div>
  <div class="toprt">
    <span class="tag">reflimR 1.1.0 · RINet 0.1.1 · scheme (d)</span>
    <div class="seg" role="group" aria-label="Language"><button type="button" id="lnAr" aria-pressed="true">عربي</button><button type="button" id="lnEn" aria-pressed="false">English</button></div>
  </div>
</header>

<div class="grid">
<section class="panel" aria-labelledby="in-h">
  <h2 id="in-h" data-i="dataH"></h2>
  <div class="step">
    <label for="vals" data-i="valsL"></label>
    <textarea id="vals" spellcheck="false"></textarea>
    <p class="hint" id="countHint"></p>
  </div>
  <div class="step">
    <label for="file" data-i="fileL"></label>
    <div class="file"><input type="file" id="file" accept=".xlsx,.xls,.csv,.txt"></div>
    <div class="btns" id="tplBtns" hidden>
      <button type="button" class="small" id="tplX" data-i="tplX"></button>
      <button type="button" class="small" id="tplC" data-i="tplC"></button>
    </div>
    <p class="hint" id="tplMsg" data-i="tplHint"></p>
    <div id="colPick" hidden>
      <div class="step" style="margin:8px 0 0"><label for="col" data-i="colL"></label><select id="col"></select></div>
      <div class="row2" style="margin-top:8px">
        <div><label for="f1c" data-i="f1L"></label><select id="f1c"></select></div>
        <div><label for="f1v" data-i="valL"></label><select id="f1v"></select></div>
      </div>
      <div class="row2" style="margin-top:8px">
        <div><label for="f2c" data-i="f2L"></label><select id="f2c"></select></div>
        <div><label for="f2v" data-i="valL"></label><select id="f2v"></select></div>
      </div>
      <p class="hint" data-i="filterHint"></p>
    </div>
  </div>
  <div class="step">
    <label data-i="sexL"></label>
    <div class="radio">
      <label><input type="radio" name="sex" id="sexF" value="F" checked> <span data-i="sexF"></span></label>
      <label><input type="radio" name="sex" id="sexM" value="M"> <span data-i="sexM"></span></label>
      <label><input type="radio" name="sex" id="sexA" value="all"> <span data-i="sexAll"></span></label>
    </div>
    <p class="hint" id="sexHint"></p>
  </div>
  <div class="step">
    <label for="analyte" data-i="analyteL"></label>
    <select id="analyte">
      <option value="TSH">TSH</option>
      <option value="FT4">FT4</option>
      <option value="TT4">Total T4</option>
      <option value="TT3">Total T3</option>
      <option value="Tg">Thyroglobulin</option>
      <option value="HbA1c">HbA1c</option>
      <option value="other" data-i="otherOpt"></option>
    </select>
    <p class="hint" data-i="analyteHint"></p>
  </div>
  <div class="step">
    <label data-i="censL"></label>
    <div class="radio">
      <label><input type="radio" name="cens" id="censR" value="replace" checked> <span data-i="censR"></span></label>
      <label><input type="radio" name="cens" id="censE" value="exclude"> <span data-i="censE"></span></label>
    </div>
  </div>
  <div class="step">
    <label data-i="mfrL"></label>
    <div class="row2">
      <div><label for="mLo" class="hint" data-i="lowL"></label><input type="number" id="mLo" step="any"></div>
      <div><label for="mHi" class="hint" data-i="highL"></label><input type="number" id="mHi" step="any"></div>
    </div>
    <div><label for="unit" class="hint" data-i="unitL"></label><input type="text" id="unit"></div>
    <p class="hint" data-i="mfrHint"></p>
  </div>
  <div class="btns">
    <button class="primary" id="run" type="button" data-i="run"></button>
    <button id="loadSample" type="button" data-i="sampleB"></button>
    <button id="clear" type="button" data-i="clearB"></button>
  </div>
  <p class="hint" style="margin-top:12px" data-i="privacy"></p>
</section>

<section class="panel" aria-labelledby="out-h">
  <h2 id="out-h" data-i="resH"></h2>
  <div id="result"></div>
</section>
</div>

<details class="about">
  <summary data-i="aboutH"></summary>
  <div id="aboutBody"></div>
</details>
<details class="about">
  <summary data-i="verH"></summary>
  <div id="verBody"></div>
</details>

<footer id="foot"></footer>
</div>

 aboutH:'شلون تشتغل الحاسبة، وشنو حدودها',verH:'شلون تأكدنا من صحة الحساب',
 about:`<ol><li><b>reflimR 1.1.0</b>: طريقة إحصائية تستبعد القيم المتطرفة ثم تقدّر الحدين من مخطط Q-Q. مدى الثقة الأصلي فيها معادلة تعتمد على حجم العينة فقط.</li>
 <li><b>RINet 0.1.1</b>: شبكة عصبية التفافية (CNN) مدرّبة على بيانات مُحاكاة، تقرأ شكل التوزيع وتقدّر الحدين. مدى الثقة الأصلي من 50 إعادة معاينة (bootstrap).</li>
 <li><b>التصحيح (conformal prediction)</b>: نوسّع مدى الثقة الأصلي بعامل <span class="mono">q̂</span> تعلّمناه من آلاف المجموعات اللي نعرف حدودها الحقيقية (محاكاة RIbench وبيانات NHANES، مع استبعاد التحليل نفسه)، حسب حجم العينة الأقرب: 300 أو 500 أو 1,000 أو 2,000.</li>
 <li>المدى المصحَّح يحتوي الحد الحقيقي بنسبة قريبة من 95% <b>في المتوسط</b> على بيانات المعايرة. هذا ليس ضماناً لكل مختبر، لأن بيانات مختبرك قد تختلف عنها.</li>
 <li>الطريقتان تقدّران الحد الأدنى للـ TSH أعلى من الحقيقي غالباً، والتصحيح يوسّع المدى ولا يحرّكه. لذلك لا تبنِ قراراً على الحد الأدنى وحده.</li>
 <li>الحاسبة أداة بحثية للمساعدة في التحقق من المدى الطبيعي، ولا تغني عن توصيات IFCC ولا عن قرار المختص.</li></ol>`,
 ver:`<ul><li>حساب reflimR في الحاسبة قورن بحزمة R الأصلية على 475 مجموعة بيانات: أكبر فرق نسبي أقل من <span class="mono">10⁻¹³</span>. في 3 مجموعات معظم قيمها متساوية أعطت الحزمة رقماً والحاسبة رسالة «تعذّر الحساب».</li>

 <li>عوامل التصحيح <span class="mono">q̂</span> مطابقة لقيم البحث، وأرقام reflimR المصحَّحة لبيانات السماوة في الحاسبة مطابقة لجدول 4 في البحث تماماً. أرقام RINet المصحَّحة قريبة منها وتختلف قليلاً بسبب إعادة المعاينة العشوائية.</li></ul>`,

 about:`<ol><li><b>reflimR 1.1.0</b>: a statistical method that removes outliers and estimates the limits from a Q-Q plot. Its native confidence interval is a formula that depends only on sample size.</li>
 <li><b>RINet 0.1.1</b>: a convolutional neural network trained on simulated data that reads the shape of the distribution and estimates the limits. Its native interval comes from 50 bootstrap resamples.</li>
 <li><b>Calibration (conformal prediction)</b>: the native interval is widened by a factor <span class="mono">q̂</span> learned from thousands of datasets with known true limits (RIbench simulations and NHANES, excluding the analyte itself), using the nearest sample-size bin of 300, 500, 1,000 or 2,000.</li>
 <li>The calibrated interval contains the true limit about 95% of the time <b>on average</b> in the calibration data. This is not a guarantee for every laboratory, because your data may differ.</li>
 <li>Both methods tended to overestimate the TSH lower limit, and calibration widens the interval without moving it, so do not base a decision on the lower limit alone.</li>

let LANG='ar'; try{ const s=localStorage.getItem('calibri-lang'); if(s==='en'||s==='ar') LANG=s; }catch(e){}
const t=(k,...a)=>{ const v=T[LANG][k]; return typeof v==='function'?v(...a):v; };
function applyLang(){ const app=$('app'); app.dir=LANG==='ar'?'rtl':'ltr'; app.lang=LANG; document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent=t(el.dataset.i); });
  $('aboutBody').innerHTML=t('about'); $('verBody').innerHTML=t('ver'); $('foot').innerHTML=t('foot');
  $('lnAr').setAttribute('aria-pressed',LANG==='ar'); $('lnEn').setAttribute('aria-pressed',LANG==='en');
  [['f1c'],['f2c']].forEach(([id])=>{ const o=$(id).querySelector('option[value=""]'); if(o) o.textContent=t('none'); });
  $('mLo').placeholder=t('mfrPh'); $('mHi').placeholder=t('mfrPh'); $('unit').placeholder=t('unitPh');
  updateSexHint(); updateCount(); if(LAST) render(); else if(!$('result').innerHTML) $('result').innerHTML=`<p class="hint">${t('emptyMsg')}</p>`; }
function setLang(l){ LANG=l; try{ localStorage.setItem('calibri-lang',l); }catch(e){} applyLang(); }

const fmt=(v,d)=>{ if(!Number.isFinite(v)) return '—'; const a=Math.abs(v); const dd=d!=null?d:(a>=100?1:a>=10?2:a>=1?2:a>=0.1?3:4); return v.toFixed(dd); };

// ---------------- example data (simulated, seeded) ----------------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function sampleData(){ const r=mulberry32(20261023); const z=()=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const out=[]; for(let i=0;i<900;i++) out.push(Math.exp(Math.log(1.55)+0.47*z()));
  for(let i=0;i<100;i++) out.push(Math.exp(Math.log(7.5)+0.75*z()));
  for(let i=out.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
  return out.map(v=>v<0.005?'<0.005':v>100?'>100':v.toFixed(3)); }

// ---------------- parsing ----------------
function parseTokens(tokens,mode){ const vals=[]; let cens=0,bad=0;
  for(let s of tokens){ s=String(s??'').trim(); if(!s) continue;
    const m=s.match(/^([<>])\s*=?\s*([0-9]*\.?[0-9]+(?:e[-+]?\d+)?)$/i);
    if(m){ cens++; if(mode==='exclude') continue; const x=parseFloat(m[2]); vals.push(m[1]==='<'?x/2:x); continue; }
    const x=Number(s); if(Number.isFinite(x)) vals.push(x); else bad++; }
  return {vals,cens,bad}; }
const textTokens=()=>$('vals').value.split(/[\s;,]+/);
let sheetRows=null, SEXCOL=null, SEXUNK=0;
const sexSel=()=>document.querySelector('input[name=sex]:checked').value;
function sexOf(v){ const x=String(v??'').trim().toLowerCase(); if(['f','female','woman','women','w','أنثى','انثى','اناث','إناث','أ','ن'].includes(x)) return 'F'; if(['m','male','man','men','ذكر','ذكور','ذ','ر'].includes(x)) return 'M'; return null; }
function sheetTokens(){ const c=$('col').value, a=$('f1c').value, av=$('f1v').value, b=$('f2c').value, bv=$('f2v').value, sx=sexSel();
  let rows=sheetRows.filter(r=>(!a||String(r[a]).trim()===av)&&(!b||String(r[b]).trim()===bv));
  SEXUNK=0; if(SEXCOL){ if(sx!=='all'){ rows=rows.filter(r=>{ const g=sexOf(r[SEXCOL]); if(!g){ if(String(r[c]??'').trim()!=='') SEXUNK++; return false; } return g===sx; }); } }
  return rows.map(r=>r[c]); }
function sexLabel(){ const sx=sexSel(); return sx==='F'?t('sexF'):sx==='M'?t('sexM'):t('sexAll'); }
function filtLabel(){ const p=[]; if(sheetRows) for(const [c,v] of [['f1c','f1v'],['f2c','f2v']]) if($(c).value) p.push(`${$(c).value} = ${$(v).value}`); return p.join(' · '); }
const grpOf=R=>[R.sex==='F'?t('sexF'):R.sex==='M'?t('sexM'):t('sexAll'),R.filt].filter(Boolean).join(' · ');
function updateSexHint(){ $('sexHint').textContent= SEXCOL ? t('sexHintCol',SEXCOL) : t('sexHintNo'); }

// ---------------- calculation ----------------
let LAST=null, METHOD='reflimR';
function compute(){
  const mode=document.querySelector('input[name=cens]:checked').value;
  const {vals,cens,bad}=parseTokens(sheetRows?sheetTokens():textTokens(),mode);
  const an=$('analyte').value, ex= an==='other'||an==='FT4' ? 'none' : an;
  const res={vals,cens,bad,mode,an,ex,sex:sexSel(),sexUnk:SEXUNK,noMatch:NOMATCH,isSample:$('vals').dataset.sample==='1'&&!sheetRows,filt:filtLabel(),unit:$('unit').value.trim(),
             mLoRaw:$('mLo').value.trim(),mHiRaw:$('mHi').value.trim()};
  res.mLo=parseFloat(res.mLoRaw); res.mHi=parseFloat(res.mHiRaw);
  const rl=reflim(vals); res.reflimR=rl;
  if(!rl.ok){ res.error=rl.reason; return res; }
  const rn=RINET.estimate(vals,50,20261016); res.RINet=rn;
  res.bin=nearestBin(rl.n);
  for(const [name,r] of [['reflimR',rl],['RINet',rn]]){ if(!r||!r.ok) continue; const Q=QHAT[name][res.ex];
    r.qL=Q.LRL[res.bin]; r.qU=Q.URL[res.bin]; r.cL=calibrate(r.lower,r.ciLower[0],r.ciLower[1],r.qL); r.cU=calibrate(r.upper,r.ciUpper[0],r.ciUpper[1],r.qU); }
  const uniq=new Set(vals.map(v=>v.toPrecision(6))).size; res.coarse=uniq<vals.length*0.15;
  return res; }
function verdictOf(m,iv){ if(!Number.isFinite(m)) return 'none'; if(!iv) return 'na'; return m>=iv[0]&&m<=iv[1]?'ok':(m<iv[0]?'low':'high'); }

// ---------------- chart ----------------
// ---------------- charts ----------------
let CHART='dist';
const ZQ=1.959963984540054;
function niceTicks(lo,hi,lg){ const ticks=[]; if(lg){ for(let e=-4;e<=6;e++) for(const m of [1,2,5]){ const v=m*Math.pow(10,e); const tv=Math.log(v); if(tv>=lo&&tv<=hi) ticks.push(v);} if(ticks.length<3){ ticks.length=0; for(let k=0;k<=4;k++) ticks.push(+Math.exp(lo+(hi-lo)*k/4).toPrecision(2)); } }
  else { const step=Math.pow(10,Math.floor(Math.log10((hi-lo)/5))); for(let v=Math.ceil(lo/step)*step; v<=hi+1e-12; v+=step) ticks.push(+v.toPrecision(6)); }
  return ticks.length>9?ticks.filter((_,i)=>i%2===0):ticks; }
function frame(W,H){ return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;display:block;direction:ltr" direction="ltr" role="img">`; }
function xAxis(lo,hi,lg,X,y0,W,P){ let g=`<line x1="${P.l}" y1="${y0}" x2="${W-P.r}" y2="${y0}" stroke="var(--line)"/>`;
  for(const v of niceTicks(lo,hi,lg)){ const xx=X(lg?Math.log(v):v); if(xx<P.l-1||xx>W-P.r+1) continue; g+=`<line x1="${xx}" y1="${y0}" x2="${xx}" y2="${y0+4}" stroke="var(--muted)"/><text x="${xx}" y="${y0+16}" text-anchor="middle">${v}</text>`; } return g; }
function vline(v,tf,lo,hi,X,y1,y2,col,dash,w){ if(!(v>0)) return ''; const u=tf(v); if(u<lo||u>hi) return ''; const xx=X(u); return `<line x1="${xx}" y1="${y1}" x2="${xx}" y2="${y2}" stroke="${col}" stroke-width="${w||2}" ${dash?'stroke-dasharray="5 4"':''}/>`; }
function range(x,r,lg,mLo,mHi){ const tf=v=>lg?Math.log(v):v; const s=Float64Array.from(x.filter(v=>v>0)).sort();

  return `<!doctype html><html lang="${LANG}" dir="${d}"><head><meta charset="utf-8"><title>${t('rep')}</title><style>body{font-family:Tahoma,Arial,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#14222C}h1{font-size:22px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #ccd;padding:6px 8px;text-align:start}th{color:#556}.m{font-family:monospace}.s{color:#556;font-size:13px}</style></head><body>
<h1>${t('rep')}</h1><p class="s">${t('repGen')}: ${new Date().toISOString().slice(0,16).replace('T',' ')} · reflimR 1.1.0 · RINet 0.1.1 · conformal scheme (d)</p>
<p>${t('repAnalyte')}: <b>${esc($('analyte').selectedOptions[0].textContent)}</b>${R.unit?' ('+esc(R.unit)+')':''}${grpOf(R)?' · '+t('group')+': '+esc(grpOf(R)):''} · ${t('repN')}: <b>${R.reflimR.n}</b> · ${t('bin')}: ${R.bin}</p>
<table><thead><tr><th>${t('cmpMethod')}</th><th>${t('cmpLimit')}</th><th>${t('cmpEst')}</th><th>${t('native','')}</th><th>${t('cmpCal')}</th><th>${t('cmpMfr')}</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table>
${nl?`<h2 style="font-size:16px">${t('repNotes')}</h2><ul>${nl}</ul>`:''}<p class="s">${t('repDisc')}</p><p class="s">CalibRI · github.com/hussein-alnaffakh1984/CalibRI</p></body></html>`; }
let DL=null;
async function save(filename,data,msgId){ const el=$(msgId);
  try{ await DL.save({filename,data}); if(el) el.textContent= msgId==='tplMsg'?t('tplSaved'):t('saved'); }
  catch(err){ const c=err&&err.code; if(el) el.textContent= c==='declined'?t('declined'): c==='rate_limited'?t('busyDl'):t('noDl'); } }
function b64bytes(b){ const s=atob(b), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }

// ---------------- events ----------------
function updateCount(){ const tk=sheetRows?sheetTokens():textTokens(); const n=tk.filter(s=>String(s??'').trim()!=='').length; $('countHint').textContent=t('count',n); }
const AN_PAT={TSH:/^tsh$/i,FT4:/^f\s*-?t4$/i,TT4:/^(t\s*-?t4|t4|total\s*t4)$/i,TT3:/^(t\s*-?t3|t3|total\s*t3)$/i,Tg:/^(tg|thyroglobulin)$/i,HbA1c:/^(hba1c|a1c|hb\s*a1c|glycated.*)$/i};
let NOMATCH=false;
function analyteFromValue(v){ for(const k in AN_PAT) if(AN_PAT[k].test(String(v).trim())) return k; return 'other'; }
function onAnalyteChange(fromFilter){ $('mLo').value=''; $('mHi').value=''; $('unit').value=''; NOMATCH=false;
  if(!fromFilter && sheetRows && $('f1c').value){ const an=$('analyte').value, opts=[...$('f1v').options].map(o=>o.value);
    const hit= an==='other'?null:opts.find(v=>AN_PAT[an].test(v)); if(hit) $('f1v').value=hit; else if(an!=='other') NOMATCH=true; }
  updateCount(); if(LAST) runNow(); }
function runNow(){ $('run').disabled=true; $('result').innerHTML=`<p class="busy">${t('busy')}</p>`;
  setTimeout(()=>{ try{ LAST=compute(); render(); } finally { $('run').disabled=false; } },30); }
$('run').addEventListener('click',runNow);
$('lnAr').addEventListener('click',()=>setLang('ar')); $('lnEn').addEventListener('click',()=>setLang('en'));
$('vals').addEventListener('input',()=>{ clearSampleMfr(); $('vals').dataset.sample='0'; sheetRows=null; SEXCOL=null; updateSexHint(); $('colPick').hidden=true; updateCount(); });
document.querySelectorAll('input[name=sex]').forEach(r=>r.addEventListener('change',()=>{ updateCount(); if(LAST) runNow(); }));
$('clear').addEventListener('click',()=>{ SEXCOL=null; updateSexHint(); $('vals').value=''; $('vals').dataset.sample='0'; sheetRows=null; $('colPick').hidden=true; $('file').value=''; $('mLo').value=''; $('mHi').value=''; $('unit').value=''; LAST=null; render(); updateCount(); });
let MFR_SAMPLE=false;
function clearSampleMfr(){ if(MFR_SAMPLE){ $('mLo').value=''; $('mHi').value=''; $('unit').value=''; MFR_SAMPLE=false; } }
function loadSample(){ setTimeout(()=>{ MFR_SAMPLE=true; },0); $('sexF').checked=true; SEXCOL=null; updateSexHint();  $('vals').value=sampleData().join('\n'); $('vals').dataset.sample='1'; sheetRows=null; $('colPick').hidden=true; $('file').value=''; $('analyte').value='TSH'; $('mLo').value='0.35'; $('mHi').value='5.10'; $('unit').value='mIU/L'; updateCount(); runNow(); }
$('loadSample').addEventListener('click',loadSample);
function fillSelect(sel,opts,withNone){ sel.innerHTML=(withNone?`<option value="">${esc(t('none'))}</option>`:'')+opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join(''); }
function refreshF(c,v,pref){ const fc=$(c).value; if(!fc){ $(v).innerHTML='<option value="">—</option>'; $(v).disabled=true; updateCount(); return; } $(v).disabled=false;
  const vs=[...new Set(sheetRows.map(r=>String(r[fc]??'').trim()))].filter(x=>x!=='').slice(0,300); fillSelect($(v),vs,false); const p=vs.find(x=>pref&&pref.test(x)); if(p) $(v).value=p; updateCount(); }
function setRows(rows){ clearSampleMfr(); sheetRows=rows; const cols=Object.keys(rows[0]||{}); fillSelect($('col'),cols,false); fillSelect($('f1c'),cols,true); fillSelect($('f2c'),cols,true);
  const numeric=c=>rows.slice(0,80).filter(r=>Number.isFinite(Number(String(r[c]??'').replace(/[<>]/g,'').trim()))&&String(r[c]??'').trim()!=='').length;
  const guess=cols.find(c=>/^\s*result\s*$/i.test(c))||cols.slice().sort((a,b)=>numeric(b)-numeric(a))[0]; $('col').value=guess;
  const fc=cols.find(c=>/chemistry|test|analyte|assay/i.test(c)); if(fc) $('f1c').value=fc; refreshF('f1c','f1v',/^tsh$/i); if($('f1c').value){ const an=analyteFromValue($('f1v').value); if(an!==$('analyte').value){ $('analyte').value=an; onAnalyteChange(true); } }
  SEXCOL=cols.find(c=>/^\s*(sex|gender|الجنس|جنس)\s*$/i.test(c))||null; refreshF('f2c','f2v',null); updateSexHint();
  $('colPick').hidden=false; $('vals').value=''; $('vals').dataset.sample='0'; updateCount(); }
$('col').addEventListener('change',()=>{ updateCount(); if(LAST) runNow(); });
$('f1v').addEventListener('change',()=>{ const an=analyteFromValue($('f1v').value); if(an!==$('analyte').value){ $('analyte').value=an; onAnalyteChange(true); } else { updateCount(); if(LAST) runNow(); } });
$('f2v').addEventListener('change',()=>{ updateCount(); if(LAST) runNow(); });
$('analyte').addEventListener('change',()=>onAnalyteChange(false));
['mLo','mHi','unit'].forEach(id=>$(id).addEventListener('input',()=>{ MFR_SAMPLE=false; }));
['mLo','mHi','unit'].forEach(id=>$(id).addEventListener('change',()=>{ if(LAST) runNow(); }));
$('f1c').addEventListener('change',()=>refreshF('f1c','f1v',null)); $('f2c').addEventListener('change',()=>refreshF('f2c','f2v',null));
$('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=ev=>{ try{ let rows;
      if(/\.(csv|txt)$/i.test(f.name)){ const txt=new TextDecoder().decode(ev.target.result).replace(/^﻿/,''); const lines=txt.split(/\r?\n/).filter(l=>l.trim()); const h0=lines[0];
        const sep=(h0.match(/;/g)||[]).length>(h0.match(/,/g)||[]).length?';':(h0.includes('\t')?'\t':',');
        const hdr=h0.split(sep).map(s=>s.trim().replace(/^"|"$/g,'')); const numHdr=hdr.every(h=>Number.isFinite(Number(h.replace(/[<>]/g,''))));
        const H=numHdr?hdr.map((_,i)=>'column '+(i+1)):hdr; rows=(numHdr?lines:lines.slice(1)).map(l=>{const c=l.split(sep);const o={};H.forEach((h,i)=>o[h]=(c[i]??'').trim().replace(/^"|"$/g,''));return o;});
      } else { if(typeof XLSX==='undefined') throw new Error('xlsx'); const wb=XLSX.read(ev.target.result,{type:'array'}); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false}); }
      rows=rows.filter(r=>Object.values(r).some(v=>String(v).trim()!=='')); if(!rows.length) throw new Error('empty'); setRows(rows); LAST=null; render();
    }catch(err){ $('result').innerHTML=`<p class="err">${t(err.message==='xlsx'?'eXlsx':'eFile')}</p>`; } };
  rd.readAsArrayBuffer(f); });
(async()=>{ if(typeof window.claude==='undefined'){ // standalone hosting (e.g. Netlify): ordinary browser downloads
    DL={save:async({filename,data})=>{ const mime=/\.csv$/.test(filename)?'text/csv':/\.html$/.test(filename)?'text/html':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
      const url=URL.createObjectURL(new Blob([data],{type:mime})); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return {status:'saved'}; }};
  } else { try{ DL=await window.claude.use("downloads"); }catch(e){ DL=null; } }
  if(!DL) return; $('tplBtns').hidden=false; if(LAST) render();
  $('tplX').addEventListener('click',()=>save('CalibRI_template.xlsx',b64bytes(TPL_XLSX),'tplMsg'));
  $('tplC').addEventListener('click',()=>save('CalibRI_template.csv','Result,Sex\n','tplMsg')); })();
applyLang(); loadSample();
</script>
